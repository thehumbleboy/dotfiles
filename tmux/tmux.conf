set-option -sa terminal-overrides ",xterm*:Tc"

# Setting prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'

# ==========================================
# MINIMAL CHAMELEON THEME
# ==========================================

# 1. Base status bar colors (Transparent background)
set -g status-style bg=default,fg=default

# 2. Position the window list in the center
set -g status-justify centre

# 3. Left side: Session Name
set -g status-left-length 40
set -g status-left "#[fg=blue,bold] #S "

# 4. Right side: Minimal time (e.g., 14:30)
# (Delete the %H:%M if you want it completely blank)
set -g status-right "#[fg=cyan]%H:%M "

# 5. Inactive Window styling
setw -g window-status-format "#[fg=default] #I:#W "

# 6. Active Window styling (Adds a subtle highlight and brackets)
setw -g window-status-current-format "#[fg=green,bold] [#I:#W] "

# 7. Pane Border styling (Dark grey for inactive, Blue for active)
set -g pane-border-style fg=color238
set -g pane-active-border-style fg=blue
